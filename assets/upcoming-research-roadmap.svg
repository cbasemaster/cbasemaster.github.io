<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Upcoming research roadmap</title>
  <desc id="desc">A polished roadmap diagram showing adaptive foundation models for deep learning, language, multimodal AI, computer vision, time-series data, physical priors, and deployment.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef6f4"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .title{font:700 34px Inter,Arial,sans-serif;fill:#111827}
      .kicker{font:700 14px Inter,Arial,sans-serif;letter-spacing:2px;fill:#1d4ed8}
      .label{font:700 20px Inter,Arial,sans-serif;fill:#111827}
      .small{font:600 15px Inter,Arial,sans-serif;fill:#475569}
      .tiny{font:600 13px Inter,Arial,sans-serif;fill:#64748b}
      .chip{font:700 15px Inter,Arial,sans-serif;fill:#0f172a}
      .white{fill:#ffffff}
    </style>
  </defs>

  <rect width="1280" height="720" rx="28" fill="#ffffff"/>
  <rect x="24" y="24" width="1232" height="672" rx="24" fill="url(#panel)" stroke="#dbe5ef"/>

  <text x="70" y="82" class="kicker">ROADMAP 2026+</text>
  <text x="70" y="122" class="title">Adaptive AI Foundation Models Across Modalities</text>
  <text x="70" y="154" class="small">Deep learning, LLMs, multimodal data, time series, vision, and physical deployment priors.</text>

  <g transform="translate(78 215)">
    <rect x="0" y="0" width="215" height="145" rx="18" fill="#ffffff" stroke="#d6dee9"/>
    <rect x="28" y="42" width="50" height="56" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
    <rect x="58" y="28" width="50" height="70" rx="8" fill="#eef2f7" stroke="#94a3b8"/>
    <rect x="88" y="52" width="50" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="108" y="118" text-anchor="middle" class="label">Foundation</text>
    <text x="108" y="140" text-anchor="middle" class="small">models</text>
  </g>

  <path d="M310 288 C370 288 405 288 454 288" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(455 190)">
    <rect x="0" y="0" width="370" height="232" rx="22" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="185" y="40" text-anchor="middle" class="label">Adaptive AI Layer</text>
    <text x="185" y="65" text-anchor="middle" class="tiny">learn at deployment, adapt without full retraining</text>

    <g transform="translate(46 92)">
      <rect x="0" y="0" width="128" height="38" rx="19" fill="#dbeafe"/>
      <text x="64" y="24" text-anchor="middle" class="chip">Test-Time Adapt.</text>
    </g>
    <g transform="translate(196 92)">
      <rect x="0" y="0" width="128" height="38" rx="19" fill="#ccfbf1"/>
      <text x="64" y="24" text-anchor="middle" class="chip">Continual Learn.</text>
    </g>
    <g transform="translate(46 146)">
      <rect x="0" y="0" width="128" height="38" rx="19" fill="#ede9fe"/>
      <text x="64" y="24" text-anchor="middle" class="chip">PEFT</text>
    </g>
    <g transform="translate(196 142)">
      <rect x="0" y="0" width="128" height="48" rx="20" fill="#fef3c7"/>
      <text x="64" y="20" text-anchor="middle" class="chip">Training-Free</text>
      <text x="64" y="38" text-anchor="middle" class="chip">SemCAM</text>
    </g>
  </g>

  <path d="M842 288 C895 288 930 288 982 288" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(982 205)">
    <rect x="0" y="0" width="220" height="165" rx="18" fill="#ffffff" stroke="#d6dee9"/>
    <circle cx="66" cy="74" r="34" fill="none" stroke="#2563eb" stroke-width="4"/>
    <path d="M40 74 C64 38 92 100 116 62" fill="none" stroke="#0f766e" stroke-width="4"/>
    <rect x="128" y="45" width="54" height="54" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
    <path d="M142 72 H168 M155 59 V85" stroke="#64748b" stroke-width="3"/>
    <text x="110" y="127" text-anchor="middle" class="label">Multimodal AI</text>
    <text x="110" y="144" text-anchor="middle" class="small">language + vision</text>
    <text x="110" y="164" text-anchor="middle" class="small">time series data</text>
  </g>

  <g transform="translate(438 485)">
    <rect x="0" y="0" width="405" height="108" rx="24" fill="url(#core)"/>
    <text x="202" y="42" text-anchor="middle" class="white" style="font:700 25px Inter,Arial,sans-serif">Robust AI Systems</text>
    <text x="202" y="72" text-anchor="middle" class="white" style="font:600 16px Inter,Arial,sans-serif">adaptive, efficient, multimodal, physical, deployment-ready</text>
  </g>

  <path d="M640 422 V474" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1092 374 C1072 454 960 515 858 535" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M185 365 C245 466 330 520 425 535" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(78 486)">
    <rect x="0" y="0" width="270" height="112" rx="18" fill="#ffffff" stroke="#d6dee9"/>
    <text x="24" y="34" class="label">Research Challenges</text>
    <text x="24" y="62" class="small">distribution shift, temporal dynamics</text>
    <text x="24" y="85" class="small">modality gaps, robustness</text>
  </g>

  <g transform="translate(924 486)">
    <rect x="0" y="0" width="278" height="112" rx="18" fill="#ffffff" stroke="#d6dee9"/>
    <text x="24" y="34" class="label">Deployment Targets</text>
    <text x="24" y="62" class="small">language, sensors, images, signals</text>
    <text x="24" y="85" class="small">health, chemistry, public systems</text>
  </g>

  <g opacity="0.35">
    <circle cx="610" cy="300" r="5" fill="#2563eb"/>
    <circle cx="655" cy="274" r="5" fill="#0f766e"/>
    <circle cx="690" cy="321" r="5" fill="#2563eb"/>
    <circle cx="735" cy="294" r="5" fill="#0f766e"/>
    <path d="M610 300 L655 274 L690 321 L735 294 M655 274 L690 321" stroke="#334155" stroke-width="2" fill="none"/>
  </g>
</svg>
